name: Refresh profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - name: Commit refreshed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile statistics'
            git push
          fi
